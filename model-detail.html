<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rocord - 모델 상세</title>
    <meta name="theme-color" content="#5865F2">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
    <style>
        @font-face { font-family: 'Daeojamjil'; src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2302_01@1.0/TheJamsil3Regular.woff2') format('woff2'); font-weight: 400; font-display: swap; }
        @font-face { font-family: 'Daeojamjil'; src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2302_01@1.0/TheJamsil5Bold.woff2') format('woff2'); font-weight: 700; font-display: swap; }
        @font-face { font-family: 'Daeojamjil'; src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2302_01@1.0/TheJamsil6ExtraBold.woff2') format('woff2'); font-weight: 800; font-display: swap; }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Daeojamjil', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: #ffffff; color: #1a1a1a; padding-top: 60px; line-height: 1.6; }
        a { text-decoration: none; color: inherit; }
        button { border: none; background: none; cursor: pointer; }

        header { position: fixed; top: 0; width: 100%; height: 60px; padding: 0 40px; display: flex; justify-content: space-between; align-items: center; z-index: 1000; backdrop-filter: blur(15px); background: rgba(255, 255, 255, 0.85); border-bottom: 1px solid rgba(0,0,0,0.05); }
        .logo-container svg { height: 24px; width: auto; display: block; cursor: pointer; }

        .header-right { display: flex; align-items: center; gap: 20px; }
        .nav-links { display: flex; gap: 20px; }
        .nav-links a { font-size: 0.95rem; font-weight: 500; transition: color 0.3s; }
        .nav-links a:hover { color: #5865F2; }

        .hamburger-btn { display: none; width: 24px; height: 24px; position: relative; z-index: 1100; }
        .hamburger-btn span { display: block; width: 100%; height: 2px; background: #1a1a1a; position: absolute; left: 0; transition: 0.3s; }
        .hamburger-btn span:nth-child(1) { top: 4px; }
        .hamburger-btn span:nth-child(2) { top: 11px; }
        .hamburger-btn span:nth-child(3) { top: 18px; }
        .hamburger-btn.active span:nth-child(1) { top: 11px; transform: rotate(45deg); }
        .hamburger-btn.active span:nth-child(2) { opacity: 0; }
        .hamburger-btn.active span:nth-child(3) { top: 11px; transform: rotate(-45deg); }

        .mobile-menu { position: fixed; top: 60px; left: 0; width: 100%; background: #fff; box-shadow: 0 4px 10px rgba(0,0,0,0.1); padding: 20px 0; display: flex; flex-direction: column; align-items: center; gap: 15px; transform: translateY(-150%); transition: transform 0.3s ease-in-out; z-index: 999; }
        .mobile-menu.active { transform: translateY(0); }
        .mobile-menu a { font-size: 1.1rem; font-weight: 700; width: 100%; text-align: center; padding: 10px 0; }

        .login-trigger-btn { background: #1a1a1a; color: #fff; padding: 8px 20px; border-radius: 50px; font-size: 0.85rem; font-weight: 700; transition: 0.3s; display: flex; align-items: center; gap: 8px; max-width: 150px; }
        .login-trigger-btn:hover { background: #333; transform: translateY(-2px); }
        .profile-name { display: inline-block; max-width: 80px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; vertical-align: middle; }
        .user-avatar { width: 24px; height: 24px; border-radius: 50%; display: none; }

        .user-dropdown { position: fixed; top: 60px; right: 40px; width: 340px; background: #fff; border-radius: 18px; box-shadow: 0 16px 48px rgba(0,0,0,0.2); padding: 0; display: none; flex-direction: column; border: 1px solid #eee; z-index: 1002; overflow: hidden; }
        .user-dropdown.active { display: flex; }
        .dropdown-banner { height: 64px; background: #fff; border-bottom: 1px solid #f0f0f0; }
        .dropdown-profile-header { display: flex; align-items: flex-end; gap: 14px; padding: 0 20px 16px; margin-top: -28px; border-bottom: 1px solid #eee; }
        .dropdown-avatar-large { width: 64px; height: 64px; border-radius: 50%; background: #eee; object-fit: cover; border: 3px solid #fff; box-shadow: 0 2px 8px rgba(0,0,0,0.15); flex-shrink: 0; }
        .dropdown-text-info { display: flex; flex-direction: column; overflow: hidden; padding-bottom: 4px; }
        .dropdown-name { font-weight: 800; font-size: 1.05rem; color: #1a1a1a; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .dropdown-id { font-size: 0.8rem; color: #888; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .dropdown-detail-list { display: flex; flex-direction: column; gap: 12px; padding: 16px 20px; border-bottom: 1px solid #eee; }
        .dropdown-detail-row { display: flex; align-items: center; justify-content: space-between; font-size: 0.85rem; }
        .dropdown-detail-row .detail-label { display: flex; align-items: center; color: #888; font-weight: 600; }
        .dropdown-detail-row .detail-label .lucide-fill { width: 14px; height: 14px; margin-right: 6px; }
        .dropdown-detail-row .detail-value { color: #1a1a1a; font-weight: 700; }
        .dropdown-detail-row .detail-value span { color: #5865F2; }
        .dropdown-actions { display: flex; flex-direction: column; gap: 10px; padding: 16px 20px 20px; }
        .cart-btn { width: 100%; padding: 10px; background: #f0f0f0; color: #333; border-radius: 8px; font-weight: 700; font-size: 0.9rem; text-align: center; transition: 0.2s; display: flex; align-items: center; justify-content: center; }
        .cart-btn:hover { background: #e0e0e0; }
        .logout-btn { width: 100%; padding: 8px; background: #ff4757; color: #fff; border-radius: 8px; font-weight: 700; font-size: 0.85rem; text-align: center; display: flex; align-items: center; justify-content: center; }
        .logout-btn:hover { background: #e84118; }

        .cart-badge { display: none; min-width: 18px; height: 18px; padding: 0 5px; margin-left: 6px; background: #5865F2; color: #fff; border-radius: 10px; font-size: 0.7rem; align-items: center; justify-content: center; font-weight: 800; }
        .cart-modal { background: #fff; width: 420px; max-width: calc(100vw - 40px); max-height: 80vh; padding: 30px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); transform: scale(0.8); transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); position: relative; display: flex; flex-direction: column; }
        .modal-overlay.show .cart-modal { transform: scale(1); }
        .cart-items-list { overflow-y: auto; display: flex; flex-direction: column; gap: 12px; margin-top: 10px; }
        .cart-empty { text-align: center; color: #888; padding: 40px 10px; font-size: 0.9rem; line-height: 1.8; }
        .cart-item { display: flex; align-items: center; gap: 12px; padding: 10px; border: 1px solid #eee; border-radius: 12px; }
        .cart-item-img { width: 48px; height: 48px; border-radius: 8px; object-fit: cover; background: #f0f0f0; flex-shrink: 0; }
        .cart-item-info { flex: 1; min-width: 0; }
        .cart-item-name { font-weight: 700; font-size: 0.9rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }
        .cart-item-actions { display: flex; align-items: center; gap: 6px; }
        .cart-item-download, .cart-item-remove { width: 32px; height: 32px; border-radius: 8px; display: flex; align-items: center; justify-content: center; background: #f5f5f5; transition: 0.2s; color: #333; }
        .cart-item-download:hover { background: #e5e9ff; color: #5865F2; }
        .cart-item-remove:hover { background: #ffe5e5; color: #ff4757; }
        .cart-toolbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 4px 0 6px; padding-bottom: 12px; border-bottom: 1px solid #eee; }
        .cart-select-all { display: flex; align-items: center; gap: 6px; font-size: 0.85rem; color: #555; font-weight: 600; cursor: pointer; }
        .cart-zip-btn { display: flex; align-items: center; padding: 8px 14px; background: #1a1a1a; color: #fff; border-radius: 8px; font-weight: 700; font-size: 0.8rem; transition: 0.2s; }
        .cart-zip-btn:hover:not(:disabled) { background: #333; }
        .cart-zip-btn:disabled { background: #ccc; cursor: not-allowed; }
        .cart-item-check { width: 18px; height: 18px; accent-color: #5865F2; flex-shrink: 0; cursor: pointer; }
        .cart-item-nofile { display: block; font-size: 0.75rem; color: #bbb; margin-top: 2px; }
        .cart-add-btn { width: 40px; height: 40px; border-radius: 12px; background: #fff; border: 2px solid #eee; display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: 0.2s; color: #555; }
        .cart-add-btn:hover { border-color: #5865F2; color: #5865F2; }
        .cart-add-btn.in-cart { background: #fff; border-color: #5865F2; color: #5865F2; }
        .cart-add-btn .lucide-fill { margin-right: 0; }

        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 2000; display: none; justify-content: center; align-items: center; opacity: 0; transition: opacity 0.3s; }
        .modal-overlay.show { opacity: 1; }
        .login-modal { background: #fff; width: 340px; padding: 30px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); transform: scale(0.8); transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); position: relative; }
        .modal-overlay.show .login-modal { transform: scale(1); }
        .modal-close { position: absolute; top: 15px; right: 20px; font-size: 1.5rem; color: #999; cursor: pointer; }
        .modal-title { font-size: 1.5rem; font-weight: 800; margin-bottom: 25px; text-align: center; }
        .input-group { margin-bottom: 15px; }
        .input-group input { width: 100%; padding: 12px 15px; border: 1px solid #ddd; border-radius: 10px; font-size: 0.95rem; outline: none; transition: 0.3s; background: #f9f9f9; }
        .input-group input:focus { border-color: #5865F2; background: #fff; }
        .btn-login-submit { width: 100%; padding: 12px; background: #1a1a1a; color: #fff; border-radius: 50px; font-weight: 700; font-size: 1rem; margin-bottom: 20px; transition: 0.2s; }
        .btn-login-submit:hover { background: #333; }
        .social-divider { text-align: center; font-size: 0.8rem; color: #aaa; margin-bottom: 20px; position: relative; }
        .social-divider::before, .social-divider::after { content: ""; position: absolute; top: 50%; width: 30%; height: 1px; background: #eee; }
        .social-divider::before { left: 0; }
        .social-divider::after { right: 0; }
        .btn-discord-modal { width: 100%; padding: 12px; background: #5865F2; color: #fff; border-radius: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 10px; transition: 0.2s; }
        .btn-discord-modal:hover { background: #4752c4; }
        .auto-login-wrapper { display: flex; align-items: center; gap: 8px; margin-bottom: 25px; cursor: pointer; user-select: none; font-size: 0.9rem; color: #666; }
        .checkbox-icon { width: 20px; height: 20px; border: 2px solid #ddd; border-radius: 6px; display: flex; align-items: center; justify-content: center; transition: 0.2s; background: #fff; }
        .checkbox-icon svg { width: 12px; height: 12px; fill: none; stroke: #fff; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; display: none; }
        .auto-login-wrapper input[type="checkbox"] { display: none; }
        .auto-login-wrapper input[type="checkbox"]:checked + .checkbox-icon { background: #5865F2; border-color: #5865F2; }
        .auto-login-wrapper input[type="checkbox"]:checked + .checkbox-icon svg { display: block; }

        .content-container { max-width: 900px; margin: 0 auto; padding: 40px 20px; min-height: 80vh; }
        .breadcrumb { font-size: 0.85rem; color: #888; margin-bottom: 20px; }
        .breadcrumb a:hover { color: #5865F2; }

        .detail-hero-img { width: 100%; max-height: 480px; object-fit: cover; border-radius: 24px; background: #f0f0f0; margin-bottom: 24px; }
        .detail-title { font-size: 2rem; font-weight: 800; margin-bottom: 10px; }
        .detail-meta { font-size: 0.85rem; color: #999; margin-bottom: 4px; }
        .detail-stats { font-size: 0.85rem; color: #999; margin-bottom: 24px; }
        .detail-content { font-size: 1rem; color: #333; line-height: 1.8; margin-bottom: 36px; word-break: break-word; }
        .detail-content p { margin: 0 0 1em; }
        .detail-content p:last-child { margin-bottom: 0; }
        .detail-content strong { font-weight: 800; color: #1a1a1a; }
        .detail-content em { font-style: italic; }
        .detail-content ul, .detail-content ol { margin: 0 0 1em; padding-left: 1.4em; }
        .detail-content li { margin-bottom: 0.4em; }
        .detail-content a { color: #5865F2; text-decoration: underline; word-break: break-all; }
        .detail-content code { background: #f5f5f5; padding: 2px 6px; border-radius: 4px; font-size: 0.9em; }
        .detail-content pre { background: #f5f5f5; padding: 14px; border-radius: 10px; overflow-x: auto; margin: 0 0 1em; }
        .detail-content blockquote { border-left: 3px solid #5865F2; padding-left: 12px; color: #666; margin: 0 0 1em; }
        .detail-content h1, .detail-content h2, .detail-content h3 { font-weight: 800; margin: 1em 0 0.5em; }
        .detail-content hr { border: none; border-top: 1px solid #eee; margin: 1.5em 0; }

        .detail-actions { display: flex; flex-wrap: wrap; gap: 12px; }
        .btn-download-lg { padding: 14px 32px; background: #1a1a1a; color: #fff; border-radius: 50px; font-weight: 700; font-size: 1rem; transition: 0.2s; }
        .btn-download-lg:hover { background: #333; }
        .btn-download-lg:disabled { background: #ccc; cursor: not-allowed; }
        .btn-discord-link { padding: 14px 32px; background: #5865F2; color: #fff; border-radius: 50px; font-weight: 700; font-size: 1rem; transition: 0.2s; display: inline-flex; align-items: center; }
        .btn-discord-link:hover { background: #4752c4; }
        .lucide-fill { width: 16px; height: 16px; fill: currentColor; vertical-align: -3px; margin-right: 6px; }

        .state-message { text-align: center; padding: 80px 20px; color: #888; }

        .spinner { width: 40px; height: 40px; border: 4px solid transparent; border-top: 4px solid #5865F2; border-right: 4px solid #5865F2; border-radius: 50%; animation: spin 0.7s linear infinite; margin: 0 auto 20px; }
        .btn-loading-spinner { display: inline-block; width: 16px; height: 16px; border: 2px solid transparent; border-top: 2px solid #fff; border-right: 2px solid #fff; border-radius: 50%; animation: spin 0.7s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .redirect-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255, 255, 255, 1); z-index: 9999; display: none; justify-content: center; align-items: center; flex-direction: column; }
        .redirect-overlay.active { display: flex; }
        .loading-spinner-large { width: 50px; height: 50px; border: 5px solid transparent; border-top: 5px solid #5865F2; border-right: 5px solid #5865F2; border-radius: 50%; animation: spin 0.7s linear infinite; margin-bottom: 20px; }

        @media (max-width: 768px) {
            header { height: 55px; padding: 0 20px; }
            .nav-links { display: none; }
            .logo-container svg { height: 20px; }
            .hamburger-btn { display: block; }
            .user-dropdown { right: 12px; width: min(340px, calc(100vw - 24px)); }
            .mobile-menu { top: 55px; border-radius: 0 0 20px 20px; }
            .detail-title { font-size: 1.5rem; }
        }
    #my-chat-widget-wrapper { font-family: sans-serif; }
#chat-button { position: fixed; bottom: 20px; right: 20px; z-index: 10001; width: 55px; height: 55px; background: white; border-radius: 20px; box-shadow: 0 0 15px 4px rgba(0, 0, 0, 0.2); cursor: pointer; display: flex; justify-content: center; align-items: center; transition: transform 0.1s ease-in-out, background-color 0.2s, box-shadow 0.2s; overflow: hidden; }
#chat-button:active { transform: scale(0.9); box-shadow: 0 0 5px 2px rgba(0, 0, 0, 0.3); }
#widget-icon-img { width: 100%; height: 100%; object-fit: cover; display: block; transition: opacity 0.2s; }
#widget-icon-close { display: none; font-size: 32px; color: #555; line-height: 1; font-weight: 300; }
#chat-button.is-open #widget-icon-img { display: none; }
#chat-button.is-open #widget-icon-close { display: block; }
#chat-button.is-open { background-color: #f0f0f0; }
#chat-window { position: fixed; bottom: 90px; right: 20px; z-index: 10000; width: 380px; height: 600px; max-width: calc(100% - 40px); max-height: calc(100% - 110px); background-color: white; border-radius: 25px; box-shadow: 0 5px 30px rgba(0,0,0,0.2); overflow: hidden; opacity: 0; visibility: hidden; transform: translateY(20px); transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1); }
#chat-window.window-visible { opacity: 1; visibility: visible; transform: translateY(0); }
.iframe-container { width: 100%; height: 100%; }
.iframe-container iframe { width: 100%; height: 100%; display: block; }
@media (max-width: 768px) { #chat-window { width: 100% !important; height: 100% !important; max-width: 100% !important; max-height: 100% !important; bottom: 0 !important; right: 0 !important; top: 0 !important; left: 0 !important; border-radius: 0 !important; z-index: 10000; } #chat-button { bottom: 20px; right: 20px; } }
</style>
</head>
<body>

    <div class="loading-spinner-large"></div>
    <h2 style="font-weight: 700;">로그인 정보 확인 중...</h2>
</div>

<header>
    <div class="logo-container" onclick="location.href='index.html'">
        <svg version="1.0" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 454.000000 95.000000" preserveAspectRatio="xMidYMid meet">

    <div class="header-right">
        <nav class="nav-links">
            <a href="model.html" style="color:#5865F2">모델</a>
            <a href="system.html">시스템</a>
            <a href="car.html">차량</a>
            <a href="shirt.html">복장</a>
        </nav>

        <button id="headerLoginBtn" class="login-trigger-btn" onclick="openLoginModal()">
            <img id="userAvatar" class="user-avatar" src="" alt="">
            <span id="loginBtnText" class="profile-name">로그인</span>
        </button>

        <button class="hamburger-btn" onclick="toggleMobileMenu()">
            <span></span>
            <span></span>
            <span></span>
        </button>
    </div>
</header>

<div class="mobile-menu" id="mobileMenu">
    <a href="model.html">모델</a>
    <a href="system.html">시스템</a>
    <a href="car.html">차량</a>
    <a href="shirt.html">복장</a>
</div>

<div class="user-dropdown" id="userDropdown">
    <div class="dropdown-banner"></div>
    <div class="dropdown-profile-header">
        <img id="dropdownAvatar" class="dropdown-avatar-large" src="" alt="Profile">
        <div class="dropdown-text-info">
            <div id="dropdownName" class="dropdown-name">사용자</div>
            <div id="dropdownId" class="dropdown-id">@username</div>
        </div>
    </div>
    <div class="dropdown-detail-list">
        <div class="dropdown-detail-row">
            <span class="detail-label"><i data-lucide="download" class="lucide-fill"></i>다운로드한 모델</span>
            <span class="detail-value"><span id="downloadCount">0</span>개</span>
        </div>
        <div class="dropdown-detail-row">
            <span class="detail-label"><i data-lucide="hash" class="lucide-fill"></i>디스코드 ID</span>
            <span class="detail-value" id="dropdownDiscordId">-</span>
        </div>
        <div class="dropdown-detail-row">
            <span class="detail-label"><i data-lucide="calendar" class="lucide-fill"></i>디스코드 가입일</span>
            <span class="detail-value" id="dropdownJoined">-</span>
        </div>
    </div>
    <div class="dropdown-actions">
        <button class="cart-btn" onclick="openCart()"><i data-lucide="shopping-cart" class="lucide-fill"></i>장바구니<span class="cart-badge">0</span></button>
        <button class="logout-btn" onclick="logout()"><i data-lucide="log-out" class="lucide-fill"></i>로그아웃</button>
    </div>
</div>

<div class="modal-overlay" id="loginModalOverlay">
    <div class="login-modal">
        <span class="modal-close" onclick="closeLoginModal()">&times;</span>
        <h2 class="modal-title">로그인</h2>
        <div class="input-group">
            <input type="text" id="loginId" placeholder="아이디">
        </div>
        <div class="input-group">
            <input type="password" id="loginPw" placeholder="비밀번호">
        </div>
        <label class="auto-login-wrapper">
            <input type="checkbox">
            <span class="checkbox-icon">
                <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"></polyline></svg>
            </span>
            자동로그인

        <button class="btn-login-submit" onclick="handleLoginSubmit()">로그인</button>

            <svg width="24" height="24" viewBox="0 0 127 96" fill="white">

<script>
    const CLIENT_ID = '1460856182716502036';
    const BACKEND_URL = 'https://rocorddev.pythonanywhere.com';

    let isLoggedIn = false;
    window.currentUserToken = null;
    let currentModel = null;
    let viewTracked = false;

    function maybeTrackView() {
        if (viewTracked || !currentModel || !currentUserToken) return;
        viewTracked = true;
        const modelId = currentModel.id;
        fetch(`https://dl.corerepublix.co.kr/api/track/view?id=${encodeURIComponent(modelId)}`, {
            method: 'POST',
            headers: { 'Authorization': `Bearer ${currentUserToken}` },
        })
            // Refresh the displayed count only after the view has actually
            // been recorded, so this visitor's own view is reflected —
            // fetching stats in parallel with the track call could read the
            // pre-increment count and look like nothing happened.
            .then(() => loadStats(modelId))
            .catch(() => {});
    }

    (function checkLoginImmediately() {
        const storedToken = localStorage.getItem('discord_session');
        if (storedToken) {
            document.getElementById('redirectOverlay').classList.add('active');
            loginToBackend(storedToken);
        }
    })();

    window.onload = function() {
        if (window.lucide) window.lucide.createIcons();
        loadModel();

        document.getElementById('loginModalOverlay').addEventListener('click', function(e) {
            if (e.target === this) closeLoginModal();
        });

        document.addEventListener('click', function(e) {
            const dropdown = document.getElementById('userDropdown');
            const headerBtn = document.getElementById('headerLoginBtn');
            const hamburger = document.querySelector('.hamburger-btn');
            const mobileMenu = document.getElementById('mobileMenu');

            if (!dropdown.contains(e.target) && !headerBtn.contains(e.target)) {
                dropdown.classList.remove('active');
            }
            if (!hamburger.contains(e.target) && !mobileMenu.contains(e.target)) {
                mobileMenu.classList.remove('active');
                hamburger.classList.remove('active');
            }
        });
    };

    function toggleMobileMenu() {
        const btn = document.querySelector('.hamburger-btn');
        const menu = document.getElementById('mobileMenu');
        btn.classList.toggle('active');
        menu.classList.toggle('active');
    }

    function loginToBackend(token) {
        document.getElementById('redirectOverlay').classList.add('active');

        fetch('https://dl.corerepublix.co.kr/api/session', {
            headers: { 'Authorization': `Bearer ${token}` }
        })
        .then(res => res.json())
        .then(data => {
            if(data.error || !data.user) throw new Error(data.error || "invalid_session");
            currentUserToken = token;
            isLoggedIn = true;
            updateUI(data.user);
            closeLoginModal();
            maybeTrackView();
        })
        .catch(err => {
            console.error(err);
            localStorage.removeItem('discord_session');
        })
        .finally(() => {
            document.getElementById('redirectOverlay').classList.remove('active');
        });
    }

    function updateUI(data) {
        const loginText = document.getElementById('loginBtnText');
        const avatar = document.getElementById('userAvatar');
        const btn = document.getElementById('headerLoginBtn');

        loginText.innerText = data.global_name || data.username;
        avatar.style.display = 'block';
        let avatarUrl = "https://cdn.discordapp.com/embed/avatars/0.png";
        if (data.avatar) {
            avatarUrl = `https://cdn.discordapp.com/avatars/${data.id}/${data.avatar}.png`;
        }
        avatar.src = avatarUrl;

        btn.style.background = "transparent";
        btn.style.color = "#1a1a1a";
        btn.style.border = "1px solid #ddd";

        document.getElementById('dropdownAvatar').src = avatarUrl;
        document.getElementById('dropdownName').innerText = data.global_name || data.username;
        document.getElementById('dropdownId').innerText = '@' + data.username;
        document.getElementById('downloadCount').innerText = data.download_count || 0;
        document.getElementById('dropdownDiscordId').innerText = data.id;
        try {
            const joinTs = Number((BigInt(data.id) >> 22n) + 1420070400000n);
            document.getElementById('dropdownJoined').innerText = new Date(joinTs).toLocaleDateString('ko-KR', { year: 'numeric', month: 'long', day: 'numeric' });
        } catch (e) {
            document.getElementById('dropdownJoined').innerText = '-';
        }
    }

    function openLoginModal() {
        if(isLoggedIn) {
            document.getElementById('userDropdown').classList.toggle('active');
        } else {
            const modal = document.getElementById('loginModalOverlay');
            modal.style.display = 'flex';
            setTimeout(() => { modal.classList.add('show'); }, 10);
        }
    }

    function closeLoginModal() {
        const modal = document.getElementById('loginModalOverlay');
        modal.classList.remove('show');
        setTimeout(() => { modal.style.display = 'none'; }, 300);
    }

    function handleLoginSubmit() {
        const id = document.getElementById('loginId').value;
        const pw = document.getElementById('loginPw').value;
        if(!id || !pw) return alert("정보를 입력하세요.");

        fetch(`${BACKEND_URL}/api/admin/login`, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({id, pw})
        })
        .then(res=>res.json())
        .then(data => {
            if(data.success) {
                localStorage.setItem('admin_token', data.token);
                window.location.href = 'upload.html';
            } else {
                alert("관리자 로그인 실패");
            }
        });
    }

    function loginWithDiscord() {
        sessionStorage.setItem('post_login_redirect', window.location.pathname + window.location.search);
        const currentRedirectUri = window.location.origin + '/auth.html';

        const oauthUrl = `https://discord.com/oauth2/authorize?client_id=${CLIENT_ID}&redirect_uri=${encodeURIComponent(currentRedirectUri)}&response_type=code&scope=identify`;
        window.location.href = oauthUrl;
    }

    function logout() {
        localStorage.removeItem('discord_session');
        isLoggedIn = false;
        currentUserToken = null;
        location.reload();
    }

    function loadModel() {
        const id = new URLSearchParams(window.location.search).get('id');
        const body = document.getElementById('detailBody');

        if (!id) {
            body.innerHTML = '<div class="state-message">모델 ID가 없습니다.</div>';
            return;
        }

        fetch('https://rocordstorage.corerepublix.co.kr/models.json')
        .then(res => res.json())
        .then(data => {
            const model = data.find(m => m.id === id);
            if (!model) {
                body.innerHTML = '<div class="state-message">해당 모델을 찾을 수 없습니다.</div>';
                return;
            }
            currentModel = model;
            document.title = `Rocord - ${model.name}`;
            renderModel(model);
            maybeTrackView();
        })
        .catch(err => {
            console.error(err);
            body.innerHTML = '<div class="state-message">데이터를 불러오는데 실패했습니다.</div>';
        });
    }

    function renderModel(model) {
        const body = document.getElementById('detailBody');
        const imgHtml = model.image ? `<img src="${escapeHtml(model.image)}" alt="${escapeHtml(model.name)}" class="detail-hero-img">` : '';
        let contentHtml = '설명이 없습니다.';
        if (model.content) {
            try {
                if (window.marked && window.DOMPurify) {
                    const preprocessed = preprocessDiscordMarkdown(model.content);
                    const rawHtml = window.marked.parse(preprocessed, { breaks: true });
                    contentHtml = window.DOMPurify.sanitize(rawHtml);
                } else {
                    // Without DOMPurify there is no safe way to trust marked's
                    // HTML output (model.content ultimately comes from a
                    // Discord forum post, i.e. untrusted input) — fail closed
                    // to escaped plain text rather than risk unsanitized HTML.
                    contentHtml = escapeHtml(model.content);
                }
            } catch (e) {
                contentHtml = escapeHtml(model.content);
            }
        }
        const updated = model.updated_at ? new Date(model.updated_at).toLocaleDateString('ko-KR') : '';

        const safeId = encodeURIComponent(model.id);
        const safeDiscordUrl = safeUrl(model.discord_url);
        body.innerHTML = `
            ${imgHtml}
            <h1 class="detail-title">${escapeHtml(model.name)}</h1>
            <p class="detail-meta">${updated ? '업데이트: ' + escapeHtml(updated) : ''}</p>
            <p class="detail-stats" id="detailStats"></p>
            <div class="detail-content">${contentHtml}</div>
            <div class="detail-actions">
                <button class="btn-download-lg" id="downloadBtn" onclick="downloadCurrentModel(this)" ${(model.has_download || model.download_url) ? '' : 'disabled'}>
                    <i data-lucide="download" class="lucide-fill"></i>${(model.has_download || model.download_url) ? '다운로드' : '다운로드 파일 없음'}
                </button>
                <a class="btn-discord-link" href="${safeDiscordUrl}" target="_blank" rel="noopener noreferrer"><i data-lucide="message-circle" class="lucide-fill"></i>디스코드에서 보기</a>
                <button class="cart-add-btn${window.isInCart && window.isInCart(model.id) ? " in-cart" : ""}" data-model-id="${escapeHtml(model.id)}" onclick="addToCartFromCard(this, '${safeId}')" title="장바구니에 담기">
                    <i data-lucide="shopping-cart" class="lucide-fill"></i>
                </button>
            </div>
        `;
        if (window.lucide) window.lucide.createIcons();
        loadStats(model.id);
    }

    function loadStats(modelId) {
        const el = document.getElementById('detailStats');
        if (!el) return;
        fetch('https://dl.corerepublix.co.kr/api/stats')
            .then(res => res.json())
            .then(data => {
                const s = data[modelId] || { views: 0, downloads: 0 };
                el.textContent = `조회 ${s.views.toLocaleString()}회 · 다운로드 ${s.downloads.toLocaleString()}회`;
            })
            .catch(() => {});
    }

    function preprocessDiscordMarkdown(text) {
        // Discord lets **bold** span multiple lines/paragraphs, which strict
        // CommonMark (marked) refuses to parse as emphasis, leaving literal
        // asterisks. Convert those spans to real <strong> tags first.
        return text.replace(/\*\*([\s\S]+?)\*\*/g, function (match, inner) {
            return '<strong>' + inner + '</strong>';
        });
    }

    function escapeHtml(str) {
        const div = document.createElement('div');
        div.innerText = str;
        return div.innerHTML;
    }

    function safeUrl(u, fallback) {
        fallback = fallback === undefined ? "#" : fallback;
        if (!u) return fallback;
        try {
            const resolved = new URL(u, window.location.href);
            if (resolved.protocol === "http:" || resolved.protocol === "https:") {
                return resolved.href;
            }
        } catch (e) {
            /* fall through to fallback */
        }
        return fallback;
    }

    async function downloadCurrentModel(btnElement) {
        if (!isLoggedIn) {
            alert("🔒 로그인이 필요한 서비스입니다.");
            openLoginModal();
            return;
        }
        if (!currentModel || (!currentModel.has_download && !currentModel.download_url)) {
            alert("다운로드 파일이 없습니다.");
            return;
        }

        const originalText = btnElement.innerHTML;
        btnElement.innerHTML = '<span class="btn-loading-spinner"></span>';
        btnElement.disabled = true;

        try {
            const url = await window.resolveDownloadUrl(currentModel, currentUserToken);
            if (!url) {
                alert("다운로드 파일이 없습니다.");
                return;
            }
            const a = document.createElement('a');
            a.href = url;
            if (currentModel.download_name) a.download = currentModel.download_name;
            document.body.appendChild(a);
            a.click();
            a.remove();
            let countSpan = document.getElementById('downloadCount');
            if (countSpan) countSpan.innerText = parseInt(countSpan.innerText) + 1;
        } catch (err) {
            if (err && err.message === 'login_required') {
                alert("🔒 로그인이 필요한 서비스입니다.");
                openLoginModal();
            } else {
                alert("다운로드 중 오류가 발생했습니다.");
            }
        } finally {
            btnElement.innerHTML = originalText;
            btnElement.disabled = false;
        }
    }

    function toggleChat() {
        const chatWindow = document.getElementById('chat-window');
        const chatBtn = document.getElementById('chat-button');
        chatWindow.classList.toggle('window-visible');
        chatBtn.classList.toggle('is-open');
    }
</script>
