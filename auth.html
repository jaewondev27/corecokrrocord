<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>로그인 처리 중...</title>
<style>
    html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #050505;
        color: #fff;
        font-family: -apple-system, "Noto Sans KR", sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
    }
    .box {
        text-align: center;
    }
    .spinner {
        width: 36px;
        height: 36px;
        margin: 0 auto 16px;
        border: 3px solid rgba(255, 255, 255, 0.2);
        border-top-color: #5865F2;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    p { font-size: 0.95rem; color: #ccc; margin: 0; }
</style>
</head>
<body>
    <div class="box">
        <div class="spinner"></div>
        <p id="statusText">로그인 처리 중입니다...</p>
    </div>

<script>
    (function () {
        var AUTH_WORKER_URL = 'https://dl.corerepublix.co.kr/api/auth/callback';

        var params = new URLSearchParams(window.location.search);
        var code = params.get('code');
        var errorParam = params.get('error');
        var isPopup = Boolean(window.opener);

        function finish(sessionToken) {
            if (isPopup) {
                if (sessionToken && typeof window.opener.handleLoginSuccess === 'function') {
                    window.opener.handleLoginSuccess(sessionToken);
                }
                window.close();
                return;
            }

            var redirectTarget = sessionStorage.getItem('post_login_redirect') || '/';
            sessionStorage.removeItem('post_login_redirect');
            // Only allow same-origin relative paths, to avoid open-redirect issues
            if (!redirectTarget.startsWith('/')) {
                redirectTarget = '/';
            }

            if (sessionToken) {
                localStorage.setItem('discord_session', sessionToken);
            }
            window.location.replace(redirectTarget);
        }

        if (code) {
            // Authorization Code flow: the raw Discord token exchange happens
            // server-side (the Worker holds the Discord Client Secret). The
            // browser only ever receives our own short-lived session token.
            fetch(AUTH_WORKER_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    code: code,
                    redirect_uri: window.location.origin + window.location.pathname,
                }),
            })
                .then(function (res) { return res.json(); })
                .then(function (data) {
                    if (data.session_token) {
                        finish(data.session_token);
                    } else {
                        document.getElementById('statusText').innerText = '로그인에 실패했습니다. 잠시 후 이동합니다...';
                        setTimeout(function () { finish(null); }, 1500);
                    }
                })
                .catch(function () {
                    document.getElementById('statusText').innerText = '로그인 중 오류가 발생했습니다. 잠시 후 이동합니다...';
                    setTimeout(function () { finish(null); }, 1500);
                });
        } else if (errorParam) {
            document.getElementById('statusText').innerText = '로그인이 취소되었습니다. 잠시 후 이동합니다...';
            setTimeout(function () { finish(null); }, 1500);
        } else {
            finish(null);
        }
    })();
</script>
</body>
</html>
