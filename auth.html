<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>로그인 처리 중...</title>
<style>
    html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #050505;
        color: #fff;
        font-family: -apple-system, "Noto Sans KR", sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
    }
    .box {
        text-align: center;
    }
    .spinner {
        width: 36px;
        height: 36px;
        margin: 0 auto 16px;
        border: 3px solid rgba(255, 255, 255, 0.2);
        border-top-color: #5865F2;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    p { font-size: 0.95rem; color: #ccc; margin: 0; }
</style>
</head>
<body>
    <div class="box">
        <div class="spinner"></div>
        <p id="statusText">로그인 처리 중입니다...</p>
    </div>

<script>
    (function () {
        var fragment = new URLSearchParams(window.location.hash.slice(1));
        var accessToken = fragment.get('access_token');
        var errorParam = fragment.get('error') || new URLSearchParams(window.location.search).get('error');

        var redirectTarget = sessionStorage.getItem('post_login_redirect') || '/';
        sessionStorage.removeItem('post_login_redirect');

        // Only allow same-origin relative paths, to avoid open-redirect issues
        if (!redirectTarget.startsWith('/')) {
            redirectTarget = '/';
        }

        if (accessToken) {
            localStorage.setItem('discord_token', accessToken);
            window.location.replace(redirectTarget);
        } else if (errorParam) {
            document.getElementById('statusText').innerText = '로그인이 취소되었습니다. 잠시 후 이동합니다...';
            setTimeout(function () {
                window.location.replace(redirectTarget);
            }, 1500);
        } else {
            // No token in URL - nothing to do, just go back
            window.location.replace(redirectTarget);
        }
    })();
</script>
</body>
</html>
